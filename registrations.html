<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Preview - DSU</title>
    <link rel="stylesheet" href="registration.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .preview-container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
        }

        .table-wrapper {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            overflow-x: auto;
        }

        h2 {
            text-align: center;
            color: #003366;
            margin-bottom: 30px;
            font-size: 2rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background-color: #003366;
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        tr:hover {
            background-color: #f8f9fa;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 1.2rem;
        }

        .refresh-btn {
            display: block;
            margin: 0 auto 20px;
            padding: 10px 20px;
            background: #003366;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            transition: transform 0.2s;
        }

        .refresh-btn:hover {
            transform: scale(1.05);
            background: #004080;
        }
    </style>
</head>

<body>
    <div class="preview-container">
        <div class="table-wrapper">
            <h2>Registered Students</h2>
            <button class="refresh-btn" onclick="fetchRegistrations()">Refresh Data</button>
            <table id="registrationsTable">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Course</th>
                        <th>DOB</th>
                        <th>Date Registered</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Data will be populated here -->
                </tbody>
            </table>
            <div id="loading" class="no-data">Loading...</div>
        </div>
    </div>

    <script>
        async function fetchRegistrations() {
            const tbody = document.querySelector('#registrationsTable tbody');
            const loading = document.getElementById('loading');

            try {
                const response = await fetch('/api/registrations');
                const data = await response.json();

                loading.style.display = 'none';
                tbody.innerHTML = '';

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="no-data">No registrations found</td></tr>';
                    return;
                }

                data.forEach(student => {
                    const row = document.createElement('tr');
                    const date = new Date(student.registrationDate).toLocaleDateString();
                    const dob = new Date(student.dob).toLocaleDateString();

                    row.innerHTML = `
                        <td><strong>${student.fullName}</strong></td>
                        <td>${student.email}</td>
                        <td>${student.phone}</td>
                        <td><span style="text-transform: uppercase; font-weight: 600; color: #003366;">${student.course}</span></td>
                        <td>${dob}</td>
                        <td>${date}</td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (error) {
                console.error('Error:', error);
                loading.textContent = 'Error loading data. Please try again.';
            }
        }

        // Load data on page load
        document.addEventListener('DOMContentLoaded', fetchRegistrations);
    </script>
</body>

</html>
